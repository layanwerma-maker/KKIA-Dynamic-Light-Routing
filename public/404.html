<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dynamic Light Routing System | KKIA</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
      //
      // GitHub Pages serves this file for any unknown path (e.g. a deep link
      // like /KKIA-Dynamic-Light-Routing/security reloaded directly). It
      // re-encodes that path into a query string and redirects to the app's
      // index.html, which decodes it back via the inline script in
      // index.html's <head> before the router mounts.
      //
      // pathSegmentsToKeep = 1 because this is a project page served from
      // https://<user>.github.io/KKIA-Dynamic-Light-Routing/ (one path
      // segment for the repo name), not a user/org root page.
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
